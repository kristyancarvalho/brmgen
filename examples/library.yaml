version: 1
model:
  type: conceptual
  name: Library
entities:
  - name: Author
    attributes:
      - name: id
        key: true
      - name: name
  - name: Book
    attributes:
      - name: isbn
        key: true
      - name: title
relationships:
  - name: Writes
    connections:
      - entity: Author
        cardinality: 0..n
      - entity: Book
        cardinality: 1..n
