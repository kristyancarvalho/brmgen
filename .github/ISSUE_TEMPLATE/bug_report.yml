name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe model and exact command that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Include brmgen, Java, operating system, and brModelo versions when relevant.
    validations:
      required: true
