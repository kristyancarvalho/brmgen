name: Publish AUR package

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published semantic version tag to synchronize
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aur-brmgen
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'kristyancarvalho/brmgen' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch environment
        run: |
          pacman -Syu --noconfirm --needed git openssh curl jq jre21-openjdk python-gobject libadwaita
          useradd --create-home --uid 1000 aurbuilder
      - name: Resolve stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          tag=$REQUESTED_TAG
          if [[ -n $tag ]]; then
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            endpoint="releases/tags/${tag}"
          else
            endpoint=releases/latest
          fi
          metadata=$(curl -fsSL --retry 3 --connect-timeout 15 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/${endpoint}")
          resolved=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name' <<<"$metadata")
          [[ $resolved =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n $tag ]]; then
            test "$tag" = "$resolved"
          fi
          printf 'tag=%s\n' "$resolved" >>"$GITHUB_OUTPUT"
          printf 'RELEASE_TAG=%s\n' "$resolved" >>"$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare publisher workspace
        run: chown -R aurbuilder:aurbuilder "$GITHUB_WORKSPACE"
      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -d -m 0700 -o aurbuilder -g aurbuilder /home/aurbuilder/.ssh
          install -m 0600 -o aurbuilder -g aurbuilder /dev/null /home/aurbuilder/.ssh/aur
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >/home/aurbuilder/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >/home/aurbuilder/.ssh/known_hosts
          chown aurbuilder:aurbuilder /home/aurbuilder/.ssh/known_hosts
          chmod 0600 /home/aurbuilder/.ssh/known_hosts
          printf '%s\n' 'Host aur.archlinux.org' '  IdentityFile ~/.ssh/aur' '  IdentitiesOnly yes' >/home/aurbuilder/.ssh/config
          chown aurbuilder:aurbuilder /home/aurbuilder/.ssh/config
          chmod 0600 /home/aurbuilder/.ssh/config
      - name: Publish package
        env:
          AUR_PUSH: "1"
        run: runuser -u aurbuilder -- env AUR_PUSH="$AUR_PUSH" "$GITHUB_WORKSPACE/scripts/aur/publish" "$RELEASE_TAG" /home/aurbuilder/brmgen
